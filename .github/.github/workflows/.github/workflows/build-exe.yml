name: Build Windows Desktop App (EXE)

on:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Tools
        run: |
          npm install -g nativefier png-to-ico

      - name: Convert PNG Icon to ICO
        shell: pwsh
        run: |
          npx png-to-ico admin-icon-512.png > icon.ico

      - name: Build EXE File
        run: |
          nativefier --name "BranchPrep Central" "https://ammarwael19985-stack.github.io/NEW-APP/admin.html" --icon "icon.ico" --portable

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Central-Windows-App
          path: |
            BranchPrep*/**/*
            *.exe
