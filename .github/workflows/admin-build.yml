name: Build Admin Desktop App

on:
  push:
    paths:
      - 'admin.html'
      - '.github/workflows/admin-build.yml'
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build Windows Executable
        run: |
          nativefier --name "BranchPrep-Admin" "https://ammarwael19985-stack.github.io/branchprep-test/admin.html" --out build/

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Admin-Windows
          path: build/*
