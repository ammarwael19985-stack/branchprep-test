name: Build Admin Desktop App

on:
  push:
    paths:
      - 'admin.html'
      - '.github/workflows/admin-build.yml'
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tools
        run: |
          npm install -g nativefier png-to-ico-cli

      - name: Convert PNG Icon to ICO
        run: |
          npx png-to-ico admin-icon-512.png > admin-icon.ico

      - name: Build Windows Executable
        run: |
          nativefier --name "BranchPrep-Admin" --icon "admin-icon.ico" "https://ammarwael19985-stack.github.io/branchprep-test/admin.html" build-out/

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Admin-Windows
          path: build-out/**
