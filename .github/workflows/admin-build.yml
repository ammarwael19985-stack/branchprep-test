name: Build Admin Desktop App

on:
  push:
    paths:
      - 'admin.html'
      - '.github/workflows/admin-build.yml'
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Executable
        run: |
          echo "Building Admin Executable..."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Admin-Setup
          path: output/*
