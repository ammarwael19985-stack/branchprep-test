name: Build Worker Mobile APK

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/worker-build.yml'
  workflow_dispatch:

jobs:
  build-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Add Android
        run: |
          cordova create myApp com.branchprep.worker BranchPrepWorker
          cd myApp
          rm -rf www/*
          cp -r ../index.html www/
          cp -r ../manifest.json www/ 2>/dev/null || true
          cp -r ../*.png www/ 2>/dev/null || true
          cordova platform add android@12.0.0

      - name: Build Android APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
