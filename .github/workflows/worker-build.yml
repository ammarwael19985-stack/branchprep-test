name: Build Worker Mobile APK

on:
  workflow_dispatch:

jobs:
  build-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Build APK File
        run: |
          mkdir -p apk_output
          pwa2apk -u "https://ammarwael19985-stack.github.io/branchprep-test/" -o apk_output || true
          find . -name "*.apk" -exec cp {} apk_output/ \; || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-APK
          path: apk_output/*.apk
