name: Build Worker Mobile APK

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/worker-build.yml'
  workflow_dispatch:

jobs:
  build-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build Android Project
        run: |
          mkdir -p apk_output
          yes | bubblewrap init --manifest="https://ammarwael19985-stack.github.io/branchprep-test/manifest.json" --directory=android_app || true
          if [ -d "android_app" ]; then
            cd android_app
            yes | bubblewrap build || true
            cp *.apk ../apk_output/BranchPrep-Worker.apk 2>/dev/null || cp app-release-signed.apk ../apk_output/BranchPrep-Worker.apk 2>/dev/null || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-APK
          path: apk_output/*.apk
