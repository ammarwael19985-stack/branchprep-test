name: Build Worker Mobile APK

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/worker-build.yml'
  workflow_dispatch:

jobs:
  build-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          mkdir -p apk_output
          npm install -g @bubblewrap/cli
          npx @bubblewrap/cli init --manifest="https://ammarwael19985-stack.github.io/branchprep-test/manifest.json" --directory=app_build --skipInfo
          cd app_build
          npx @bubblewrap/cli build --skipSigning || true
          cp *.apk ../apk_output/BranchPrep-Worker.apk 2>/dev/null || find . -name "*.apk" -exec cp {} ../apk_output/ \; || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-APK
          path: apk_output/*.apk
