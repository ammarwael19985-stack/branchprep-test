name: Build Worker Mobile APK

on:
  workflow_dispatch:

jobs:
  build-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Android APK
        run: |
          mkdir -p apk_output
          # توليد تطبيق الأندرويد من موقع GitHub Pages
          npx @bubblewrap/cli init --manifest="https://ammarwael19985-stack.github.io/branchprep-test/manifest.json" --directory=android_project || true
          
          if [ -d "android_project" ]; then
            cd android_project
            npx @bubblewrap/cli build
            cp app-release-signed.apk ../apk_output/BranchPrep-Worker.apk || cp *.apk ../apk_output/BranchPrep-Worker.apk || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-APK
          path: |
            **/*.apk
            apk_output/*.apk
