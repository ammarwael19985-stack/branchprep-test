name: Build Worker Mobile APK

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/worker-build.yml'
  workflow_dispatch:

jobs:
  build-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          echo "Building Worker APK..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-APK
          path: '*.apk'
