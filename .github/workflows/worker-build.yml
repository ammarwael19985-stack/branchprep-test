name: Build Worker Mobile APK

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/worker-build.yml'
  workflow_dispatch:

jobs:
  build-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android APK using PWABuilder
        run: |
          npx @pwabuilder/pwabuilder pwa https://ammarwael19985-stack.github.io/branchprep-test/ -o output/ -platform android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchPrep-Worker-APK
          path: output/**/*.apk
